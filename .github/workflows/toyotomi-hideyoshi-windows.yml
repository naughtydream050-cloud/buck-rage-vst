name: Build Toyotomi Hideyoshi Windows VST3

on:
  workflow_dispatch:
  push:
    paths:
      - '**'
      - '.github/workflows/toyotomi-hideyoshi-windows.yml'

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Record authoritative source snapshot
        shell: pwsh
        run: |
          $repoPath = (Get-Location).Path
          $projectPath = (Get-Location).Path
          $head = git rev-parse HEAD
          $status = (git status --short | Out-String).Trim()
          @(
            "REPOSITORY_PATH=$repoPath"
            "PROJECT_PATH=$projectPath"
            "SOURCE_HEAD=$head"
            "GIT_STATUS=$status"
          ) | Set-Content -LiteralPath SOURCE_HEAD.txt -Encoding utf8
          Get-Content SOURCE_HEAD.txt

      - name: Print CMake and MSVC versions
        shell: pwsh
        run: |
          cmake --version
          $vsDevCmd = Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          if (!(Test-Path -LiteralPath $vsDevCmd)) { throw "VsDevCmd was not found: $vsDevCmd" }
          cmd /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && cl"

      - name: Verify complete JUCE 7.0.12 source tree
        shell: pwsh
        run: |
          $jucePath = (Resolve-Path -LiteralPath 'JUCE').Path
          $required = @(
            'JUCE/CMakeLists.txt',
            'JUCE/modules/juce_core',
            'JUCE/modules/juce_audio_processors',
            'JUCE/modules/juce_gui_basics'
          )
          $missing = $required | Where-Object { !(Test-Path -LiteralPath $_) }
          if ($missing) { throw "Incomplete JUCE source tree: $($missing -join ', ')" }
          Write-Host "JUCE_PATH=$jucePath"
          Select-String -LiteralPath 'JUCE/CMakeLists.txt' -Pattern 'project\(JUCE VERSION' | ForEach-Object { Write-Host $_.Line }

      - name: Configure Release VST3
        shell: pwsh
        run: |
          cmake -S . `
            -B build-toyotomi-hideyoshi `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            "-DTOYOTOMI_JUCE_DIR=$((Resolve-Path -LiteralPath 'JUCE').Path)"

      - name: Compile and link Release VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build-toyotomi-hideyoshi `
            --config Release `
            --target ToyotomiHideyoshi_VST3 `
            --parallel 1 --verbose 2>&1 | Tee-Object -FilePath toyotomi-build.log
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $binary = 'build-toyotomi-hideyoshi/ToyotomiHideyoshi_artefacts/Release/VST3/Toyotomi Hideyoshi.vst3/Contents/x86_64-win/Toyotomi Hideyoshi.vst3'
          if ($buildExit -ne 0) {
            $diagnostic = Get-Content -LiteralPath toyotomi-build.log |
              Where-Object { $_ -match '(: error |fatal error|LNK[0-9]+|FAILED:|error:)' } |
              Select-Object -Last 8
            $summary = (($diagnostic -join ' | ') -replace '::', ':')
            if ([string]::IsNullOrWhiteSpace($summary)) { $summary = 'No compiler diagnostic matched; inspect ToyotomiHideyoshi-build-diagnostics.' }
            Write-Output "::error title=VST3 build diagnostic::$summary"
            exit $buildExit
          }
          if (!(Test-Path -LiteralPath $binary)) { throw "VST3 binary is missing after a successful build: $binary" }

      - name: Upload compact build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToyotomiHideyoshi-build-diagnostics
          path: |
            toyotomi-build.log
            toyotomi-state-tests.log
            toyotomi-runtime-smoke.log
            state-test-exit.txt
            runtime-smoke-exit.txt
          if-no-files-found: warn

      - name: Run state-model round-trip tests
        id: state_tests
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build-toyotomi-hideyoshi --config Release --target ToyotomiHideyoshiStateTests --parallel 2>&1 | Tee-Object toyotomi-state-tests.log
          $buildExit=$LASTEXITCODE
          if ($buildExit -eq 0) { & 'build-toyotomi-hideyoshi/ToyotomiHideyoshiStateTests_artefacts/Release/ToyotomiHideyoshiStateTests.exe' 2>&1 | Tee-Object -Append toyotomi-state-tests.log; $testExit=$LASTEXITCODE } else { $testExit=$buildExit }
          "STATE_BUILD_EXIT=$buildExit STATE_TEST_EXIT=$testExit" | Tee-Object -Append toyotomi-state-tests.log
          Set-Content -LiteralPath state-test-exit.txt -Value $testExit -NoNewline
          "exit_code=$testExit" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Run Editor runtime smoke test
        id: runtime_smoke
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build-toyotomi-hideyoshi --config Release --target ToyotomiHideyoshiRuntimeSmoke --parallel 2>&1 | Tee-Object toyotomi-runtime-smoke.log
          $buildExit=$LASTEXITCODE
          if ($buildExit -eq 0) { & 'build-toyotomi-hideyoshi/ToyotomiHideyoshiRuntimeSmoke_artefacts/Release/ToyotomiHideyoshiRuntimeSmoke.exe' 2>&1 | Tee-Object -Append toyotomi-runtime-smoke.log; $testExit=$LASTEXITCODE } else { $testExit=$buildExit }
          "SMOKE_BUILD_EXIT=$buildExit SMOKE_TEST_EXIT=$testExit" | Tee-Object -Append toyotomi-runtime-smoke.log
          Set-Content -LiteralPath runtime-smoke-exit.txt -Value $testExit -NoNewline
          "exit_code=$testExit" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Verify V2 renderer exclusivity
        if: always()
        shell: pwsh
        run: |
          $cmake = Get-Content -LiteralPath 'CMakeLists.txt' -Raw
          $forbidden = @('Source/PluginEditor.cpp', 'Source/UIComponents.cpp')
          $found = @($forbidden | Where-Object { $cmake.Contains($_) })
          $result = [ordered]@{
            editor = 'PluginEditorV2'
            forbidden_production_sources = $found
            status = if ($found.Count -eq 0) { 'PASS' } else { 'FAIL' }
          } | ConvertTo-Json
          Set-Content -LiteralPath 'v2-renderer-exclusivity.json' -Value $result -Encoding utf8
          if ($found.Count -ne 0) { throw "Retired UI source remains in production target: $($found -join ', ')" }

      - name: Upload test diagnostics and BAR MAP render previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToyotomiHideyoshi-test-diagnostics
          path: |
            toyotomi-state-tests.log
            toyotomi-runtime-smoke.log
            bar-map-render-*.png
            toyotomi-editor-*.png
            toyotomi-timeline-editor-full.png
            toyotomi-quote-panel.png
            toyotomi-preset-preview-*.png
            toyotomi-bar-labels-*.png
            toyotomi-bar-waveform-*.png
            v2-*.png
            v2-*.json
            ui/v2/runtime-manifest.json
            ui/v2/visual_acceptance_manifest.json
            SOURCE_HEAD.txt
          if-no-files-found: error

      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath 'build-toyotomi-hideyoshi' -Recurse -Directory -Filter 'Toyotomi Hideyoshi.vst3')
          if ($bundles.Count -ne 1) { throw "Expected one Toyotomi Hideyoshi.vst3 bundle, found $($bundles.Count)." }
          $bundle = $bundles[0]
          $binary = Join-Path $bundle.FullName 'Contents/x86_64-win/Toyotomi Hideyoshi.vst3'
          if (!(Test-Path -LiteralPath $binary)) { throw "VST3 binary is missing: $binary" }
          $size = (Get-ChildItem -LiteralPath $bundle.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "VST3_BUNDLE=$($bundle.FullName)"
          Write-Host "VST3_BINARY=$binary"
          Write-Host "VST3_SIZE_BYTES=$size"
          Write-Host "VST3_LAST_WRITE_UTC=$($bundle.LastWriteTimeUtc.ToString('o'))"
          Get-ChildItem -LiteralPath $bundle.FullName -Recurse -Force | Select-Object FullName,Length,LastWriteTimeUtc | Format-Table -AutoSize

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: ToyotomiHideyoshi-Windows-VST3
          path: |
            build-toyotomi-hideyoshi/**/*.vst3
            SOURCE_HEAD.txt
          if-no-files-found: error

      - name: Aggregate validation
        if: always()
        shell: pwsh
        run: |
          # Step outputs are retained for the Actions UI, but persisted files are
          # the authoritative inputs here: they survive `if: always()` execution
          # even when a preceding test command has written stderr.
          $stateExit = if (Test-Path -LiteralPath state-test-exit.txt) { (Get-Content -LiteralPath state-test-exit.txt -Raw).Trim() } else { 'MISSING' }
          $smokeExit = if (Test-Path -LiteralPath runtime-smoke-exit.txt) { (Get-Content -LiteralPath runtime-smoke-exit.txt -Raw).Trim() } else { 'MISSING' }
          if ($stateExit -ne '0' -or $smokeExit -ne '0') {
            foreach ($entry in @(@{ name = 'StateModelTests'; exit = $stateExit; log = 'toyotomi-state-tests.log' }, @{ name = 'RuntimeSmoke'; exit = $smokeExit; log = 'toyotomi-runtime-smoke.log' })) {
              if ($entry.exit -ne '0' -and (Test-Path -LiteralPath $entry.log)) {
                $diagnostic = Get-Content -LiteralPath $entry.log |
                  Where-Object { $_ -match '(FAIL |error|exception|assert|access violation)' } |
                  Select-Object -Last 12
                $summary = (($diagnostic -join ' | ') -replace '::', ':')
                if ([string]::IsNullOrWhiteSpace($summary)) { $summary = "See $($entry.log) in ToyotomiHideyoshi-test-diagnostics." }
                Write-Output "::error title=$($entry.name) diagnostic::$summary"
              }
            }
            throw "BAR MAP validation failed: StateModelTests=$stateExit RuntimeSmoke=$smokeExit"
          }
