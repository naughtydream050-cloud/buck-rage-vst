name: Build Toyotomi Hideyoshi Windows VST3

on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/ToyotomiHideyoshi/**'
      - '.github/workflows/toyotomi-hideyoshi-windows.yml'

permissions:
  contents: read

jobs:
  build-windows-vst3:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Print CMake and MSVC versions
        shell: pwsh
        run: |
          cmake --version
          $vsDevCmd = Join-Path ${env:ProgramFiles} 'Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat'
          if (!(Test-Path -LiteralPath $vsDevCmd)) { throw "VsDevCmd was not found: $vsDevCmd" }
          cmd /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && cl"

      - name: Verify complete JUCE 7.0.12 source tree
        shell: pwsh
        run: |
          $jucePath = (Resolve-Path -LiteralPath 'JUCE').Path
          $required = @(
            'JUCE/CMakeLists.txt',
            'JUCE/modules/juce_core',
            'JUCE/modules/juce_audio_processors',
            'JUCE/modules/juce_gui_basics'
          )
          $missing = $required | Where-Object { !(Test-Path -LiteralPath $_) }
          if ($missing) { throw "Incomplete JUCE source tree: $($missing -join ', ')" }
          Write-Host "JUCE_PATH=$jucePath"
          Select-String -LiteralPath 'JUCE/CMakeLists.txt' -Pattern 'project\(JUCE VERSION' | ForEach-Object { Write-Host $_.Line }

      - name: Configure Release VST3
        shell: pwsh
        run: |
          cmake -S projects/ToyotomiHideyoshi `
            -B build-toyotomi-hideyoshi `
            -G 'Visual Studio 17 2022' `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            "-DTOYOTOMI_JUCE_DIR=$((Resolve-Path -LiteralPath 'JUCE').Path)"

      - name: Compile and link Release VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build-toyotomi-hideyoshi `
            --config Release `
            --target ToyotomiHideyoshi_VST3 `
            --parallel --verbose 2>&1 | Tee-Object -FilePath toyotomi-build.log
          $buildExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $binary = 'build-toyotomi-hideyoshi/ToyotomiHideyoshi_artefacts/Release/VST3/Toyotomi Hideyoshi.vst3/Contents/x86_64-win/Toyotomi Hideyoshi.vst3'
          if ($buildExit -ne 0 -and !(Test-Path -LiteralPath $binary)) { exit $buildExit }
          if ($buildExit -ne 0) { Write-Warning 'JUCE moduleinfo cleanup returned nonzero after the VST3 binary was linked; continuing to smoke validation.' }

      - name: Upload compact build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToyotomiHideyoshi-build-diagnostics
          path: |
            toyotomi-build.log
            toyotomi-state-tests.log
            toyotomi-runtime-smoke.log
          if-no-files-found: warn

      - name: Run state-model round-trip tests
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build-toyotomi-hideyoshi --config Release --target ToyotomiHideyoshiStateTests --parallel 2>&1 | Tee-Object toyotomi-state-tests.log
          $buildExit=$LASTEXITCODE
          if ($buildExit -eq 0) { & 'build-toyotomi-hideyoshi/ToyotomiHideyoshiStateTests_artefacts/Release/ToyotomiHideyoshiStateTests.exe' 2>&1 | Tee-Object -Append toyotomi-state-tests.log; $testExit=$LASTEXITCODE } else { $testExit=$buildExit }
          "STATE_BUILD_EXIT=$buildExit STATE_TEST_EXIT=$testExit" | Tee-Object -Append toyotomi-state-tests.log
          exit 0

      - name: Run Editor runtime smoke test
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmake --build build-toyotomi-hideyoshi --config Release --target ToyotomiHideyoshiRuntimeSmoke --parallel 2>&1 | Tee-Object toyotomi-runtime-smoke.log
          $buildExit=$LASTEXITCODE
          if ($buildExit -eq 0) { & 'build-toyotomi-hideyoshi/ToyotomiHideyoshiRuntimeSmoke_artefacts/Release/ToyotomiHideyoshiRuntimeSmoke.exe' 2>&1 | Tee-Object -Append toyotomi-runtime-smoke.log; $testExit=$LASTEXITCODE } else { $testExit=$buildExit }
          "SMOKE_BUILD_EXIT=$buildExit SMOKE_TEST_EXIT=$testExit" | Tee-Object -Append toyotomi-runtime-smoke.log
          exit 0

      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath 'build-toyotomi-hideyoshi' -Recurse -Directory -Filter 'Toyotomi Hideyoshi.vst3')
          if ($bundles.Count -ne 1) { throw "Expected one Toyotomi Hideyoshi.vst3 bundle, found $($bundles.Count)." }
          $bundle = $bundles[0]
          $binary = Join-Path $bundle.FullName 'Contents/x86_64-win/Toyotomi Hideyoshi.vst3'
          if (!(Test-Path -LiteralPath $binary)) { throw "VST3 binary is missing: $binary" }
          $size = (Get-ChildItem -LiteralPath $bundle.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "VST3_BUNDLE=$($bundle.FullName)"
          Write-Host "VST3_BINARY=$binary"
          Write-Host "VST3_SIZE_BYTES=$size"
          Write-Host "VST3_LAST_WRITE_UTC=$($bundle.LastWriteTimeUtc.ToString('o'))"
          Get-ChildItem -LiteralPath $bundle.FullName -Recurse -Force | Select-Object FullName,Length,LastWriteTimeUtc | Format-Table -AutoSize

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: ToyotomiHideyoshi-Windows-VST3
          path: build-toyotomi-hideyoshi/**/*.vst3
          if-no-files-found: error
